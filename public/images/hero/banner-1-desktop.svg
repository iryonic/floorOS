<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 620" width="1350" height="620">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2A24"/>
      <stop offset="50%" stop-color="#2D3E35"/>
      <stop offset="100%" stop-color="#16201B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B168"/>
      <stop offset="100%" stop-color="#C29249"/>
    </linearGradient>
    <pattern id="chevron" width="120" height="80" patternUnits="userSpaceOnUse">
      <path d="M0 40 L60 0 L120 40 L120 80 L60 40 L0 80 Z" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1350" height="620" fill="url(#g1)"/>
  <rect width="1350" height="620" fill="url(#chevron)"/>
  <circle cx="1150" cy="310" r="280" fill="rgba(226,177,104,0.08)"/>
  <g transform="translate(100, 200)">
    <rect x="0" y="0" width="180" height="32" rx="16" fill="rgba(226,177,104,0.18)" stroke="#E2B168" stroke-width="1"/>
    <text x="90" y="21" fill="#E2B168" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">ATELIER COLLECTION</text>
    <text x="0" y="90" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Grandeur French Chevron</text>
    <text x="0" y="145" fill="rgba(255,255,255,0.75)" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="400">Authentic European Oak Parquet with Precision Tongue-and-Groove Milling</text>
    <g transform="translate(0, 190)">
