  <!-- Architectural Plank Graphic on Right -->
  <g transform="translate(880, 120)">
    <rect x="0" y="0" width="340" height="380" rx="24" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <rect x="25" y="25" width="290" height="150" rx="16" fill="#C29249" opacity="0.85"/>
    <rect x="25" y="190" width="290" height="150" rx="16" fill="#8C6633" opacity="0.85"/>
    <text x="170" y="365" fill="rgba(255,255,255,0.5)" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="middle">100% Solid European White Oak</text>
