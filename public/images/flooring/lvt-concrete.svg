<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <rect width="600" height="450" fill="#888B8D"/>
        <rect width="600" height="450" fill="#888B8D"/>
      <!-- Marble Veining -->
      <path d="M 0 100 Q 150 120 280 80 T 500 160 T 600 120" stroke="#616466" stroke-width="4" fill="none" opacity="0.6"/>
      <path d="M 50 0 Q 180 180 320 220 T 550 350" stroke="#616466" stroke-width="2.5" fill="none" opacity="0.5"/>
      <path d="M 200 450 Q 280 300 420 260 T 600 290" stroke="#616466" stroke-width="3" fill="none" opacity="0.4"/>
      <path d="M 0 350 Q 120 320 220 380" stroke="#616466" stroke-width="2" fill="none" opacity="0.4"/>
  <!-- Gradient Overlay for Depth -->
  <linearGradient id="overlay" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
    <stop offset="65%" stop-color="#000000" stop-opacity="0.0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
  </linearGradient>
  <rect width="600" height="450" fill="url(#overlay)"/>
  
  <!-- Subtle Tag & Brand Watermark -->
  <g transform="translate(30, 360)">
    <rect width="180" height="52" rx="6" fill="#121815" opacity="0.85"/>
    <text x="16" y="24" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700">Concrete Loft</text>
    <text x="16" y="42" fill="#D4AF37" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">LVT-03</text>
  </g>
</svg>