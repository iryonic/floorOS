<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <rect width="600" height="450" fill="#B37D43"/>
        <rect width="600" height="70" fill="#B37D43" stroke="#8D5B25" stroke-width="2"/>
      <line x1="20" y1="35" x2="560" y2="35" stroke="#8D5B25" stroke-width="1" stroke-dasharray="20 15 40 25"/>
      <rect y="75" width="600" height="70" fill="#B37D43" stroke="#8D5B25" stroke-width="2"/>
      <line x1="10" y1="110" x2="580" y2="110" stroke="#8D5B25" stroke-width="1" stroke-dasharray="30 20 15 35"/>
      <rect y="150" width="600" height="70" fill="#B37D43" stroke="#8D5B25" stroke-width="2"/>
      <line x1="40" y1="185" x2="540" y2="185" stroke="#8D5B25" stroke-width="1" stroke-dasharray="15 30 45 15"/>
      <rect y="225" width="600" height="70" fill="#B37D43" stroke="#8D5B25" stroke-width="2"/>
      <rect y="300" width="600" height="70" fill="#B37D43" stroke="#8D5B25" stroke-width="2"/>
      <rect y="375" width="600" height="70" fill="#B37D43" stroke="#8D5B25" stroke-width="2"/>
  <!-- Gradient Overlay for Depth -->
  <linearGradient id="overlay" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
    <stop offset="65%" stop-color="#000000" stop-opacity="0.0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
  </linearGradient>
  <rect width="600" height="450" fill="url(#overlay)"/>
  
  <!-- Subtle Tag & Brand Watermark -->
  <g transform="translate(30, 360)">
    <rect width="180" height="52" rx="6" fill="#121815" opacity="0.85"/>
    <text x="16" y="24" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700">Smoked Honey</text>
    <text x="16" y="42" fill="#D4AF37" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">OAK-02</text>
  </g>
</svg>